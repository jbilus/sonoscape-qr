<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SonoScape QR Labels</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --fg: #111;
      --muted: #555;
      --card: #fff;
      --border: #ccc;
      --dark: #111;
      --warn: #fff7d6;
      --warn-border: #d9b100;
      --ok: #e7f7ea;
      --ok-border: #4b9b5f;
      --danger: #ffe8e8;
      --danger-border: #b00020;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
    }

    header {
      padding: 16px;
      background: var(--dark);
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    main {
      padding: 14px;
      max-width: 720px;
      margin: auto;
    }

    input, select, button, textarea {
      width: 100%;
      box-sizing: border-box;
      font-size: 18px;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-family: inherit;
    }

    button { cursor: pointer; }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-align: left;
    }

    .region {
      font-size: 13px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      margin: 5px 0;
    }

    .subtitle {
      font-size: 14px;
      color: #444;
    }

    .qrView {
      display: none;
      position: fixed;
      inset: 0;
      background: white;
      z-index: 10;
      padding: 18px;
      text-align: center;
      overflow: auto;
    }

    .qrView.active { display: block; }

    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 280px;
      margin: 24px 0 16px;
    }

    .qrText {
      white-space: pre-wrap;
      text-align: left;
      background: #f2f2f2;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .closeBtn {
      background: var(--dark);
      color: white;
      border: none;
      margin-top: 18px;
    }

    .secondaryBtn {
      background: #f2f2f2;
      color: #111;
    }

    .refreshBtn {
      background: #111;
      color: white;
      border: none;
    }

    .warning, .success, .errorBox {
      border-radius: 10px;
      padding: 12px;
      text-align: left;
      font-size: 15px;
      margin-bottom: 12px;
    }

    .warning {
      background: var(--warn);
      border: 1px solid var(--warn-border);
    }

    .success {
      background: var(--ok);
      border: 1px solid var(--ok-border);
    }

    .errorBox {
      background: var(--danger);
      border: 1px solid var(--danger-border);
    }

    .small {
      color: var(--muted);
      font-size: 13px;
      text-align: left;
      margin-top: 8px;
      white-space: pre-wrap;
    }

    canvas {
      image-rendering: pixelated;
      border: 12px solid white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.16);
    }
  </style>
</head>
<body>
  <header>
    <h1>SonoScape QR Labels</h1>
  </header>

  <main>
    <input id="search" placeholder="Suche: pir, gon, isg, root, shoulder ..." autofocus />

    <select id="regionFilter">
      <option value="">Alle Regionen</option>
    </select>

    <button id="refreshBtn" class="refreshBtn" type="button">Liste aus Google Sheets aktualisieren</button>
    <div id="message" class="small"></div>
    <div id="results"></div>
    <div id="testResults" class="small"></div>
  </main>

  <div id="qrView" class="qrView" aria-modal="true" role="dialog">
    <h2 id="qrTitle"></h2>
    <div id="statusMessage"></div>
    <div id="qrcode"></div>
    <div id="qrPayload" class="qrText"></div>
    <button id="copyBtn" class="secondaryBtn" type="button">Text kopieren</button>
    <button id="closeBtn" class="closeBtn" type="button">Schließen</button>
  </div>

  <script>
    "use strict";

    const untersucher = "Dr. Radu-Lucian Jilavu";

    // Google Sheets CSV-Link eintragen.
    // In Google Sheets: Datei -> Freigeben -> Im Web veröffentlichen -> CSV.
    // Erwartete Spalten: region, code, en, de, beschreibung
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSmvm3tDY1IDmX_z6vre-vttTzzv_UpCrBpoRrOfx2FzgAi53n957cN_VP9OHO1uisRAAaSiYF3M2x3/pub?output=csv";

    let currentPayload = "";

    let items = [
      {
        region: "HWS",
        code: "PRNI-HWS",
        en: "sonography guided peri-radicular nerve root injection",
        de: "Ultraschallgesteuerte periradikuläre Nervenwurzelinjektion",
        beschreibung: "Ultraschallgesteuerte Injektion an die Nervenwurzel, periradikuläre Injektion Halswirbelsäule"
      },
      {
        region: "HWS",
        code: "GON",
        en: "sonography guided Greater occipital nerve block",
        de: "sonografiegesteuerte Blockade des Nervus occipitalis major",
        beschreibung: "Ultraschallgeführte Blockade des großen Hinterhauptsnervs, Nervus occipitalis major"
      },
      {
        region: "LWS",
        code: "ISG",
        en: "SI joint injection",
        de: "ISG-Infiltration",
        beschreibung: "Injektion am Iliosakralgelenk, ISG, SIG"
      },
      {
        region: "Becken",
        code: "PIRI",
        en: "Piriformis muscle injection",
        de: "Injektion in den Piriformis-Muskel",
        beschreibung: "Injektion in den Piriformis-Muskel"
      }
    ];

    function byId(id) {
      return document.getElementById(id);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalize(value) {
      return String(value || "").toLowerCase().trim();
    }

    function makePayload(item) {
      const lines = [];
      lines.push("Beschreibung:");
      if (item.de) lines.push(String(item.de));
      if (item.beschreibung) lines.push(String(item.beschreibung));
      if (item.indication) lines.push("Indikation: " + String(item.indication));
      if (item.patient_position) lines.push("Lagerung: " + String(item.patient_position));
      if (item.sonde) lines.push("Sonde: " + String(item.sonde));
      if (item.guidance) lines.push("Guidance: " + String(item.guidance));
      lines.push("");
      lines.push("Untersucher:");
      lines.push(untersucher);
      return lines.join("\n");
    }

    function getRegions() {
      const regionSet = new Set();
      items.forEach(item => {
        if (item.region) regionSet.add(item.region);
      });
      return Array.from(regionSet).sort((a, b) => a.localeCompare(b, "de"));
    }

    function populateRegionFilter() {
      const select = byId("regionFilter");
      const selected = select.value;
      select.innerHTML = '<option value="">Alle Regionen</option>';
      getRegions().forEach(region => {
        const option = document.createElement("option");
        option.value = region;
        option.textContent = region;
        select.appendChild(option);
      });
      if (selected && getRegions().includes(selected)) {
        select.value = selected;
      }
    }

    function getFilteredItems(query, region) {
      const q = normalize(query);
      return items.filter(item => {
        const haystack = normalize(Object.values(item).join(" "));
        return (!region || item.region === region) && (!q || haystack.includes(q));
      });
    }

    function render() {
      populateRegionFilter();

      const query = byId("search").value;
      const region = byId("regionFilter").value;
      const results = byId("results");
      results.innerHTML = "";

      const filtered = getFilteredItems(query, region);

      if (filtered.length === 0) {
        results.innerHTML = '<div class="card">Keine Treffer.</div>';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "card";
        card.innerHTML =
          '<div class="region">' + escapeHtml(item.region) + ' · ' + escapeHtml(item.code) + '</div>' +
          '<div class="title">' + escapeHtml(item.de) + '</div>' +
          '<div class="subtitle">' + escapeHtml(item.en) + '</div>' +
          '<div class="subtitle">' + escapeHtml([item.category, item.guidance, item.indication].filter(Boolean).join(' · ')) + '</div>';
        card.addEventListener("click", () => showQr(item));
        results.appendChild(card);
      });
    }

    function showQr(item) {
      currentPayload = makePayload(item);
      byId("qrTitle").textContent = String(item.code || "") + " · " + String(item.region || "");
      byId("qrPayload").textContent = currentPayload;
      byId("statusMessage").innerHTML = "";
      byId("qrcode").innerHTML = "";

      try {
        drawRealQrCodeOnline(byId("qrcode"), currentPayload);
        byId("statusMessage").innerHTML =
          '<div class="success">' +
          'Echter QR-Code für den Live-Test. Hinweis: Diese Variante nutzt online einen kostenlosen QR-Bilddienst. Für die endgültige Praxisversion wird der QR-Generator lokal eingebunden, damit es vollständig offline läuft.' +
          '</div>';
      } catch (error) {
        byId("statusMessage").innerHTML =
          '<div class="errorBox">QR-Code konnte nicht erzeugt werden.<br>Fehler: ' +
          escapeHtml(error && error.message ? error.message : String(error)) +
          '</div>';
      }

      byId("qrView").classList.add("active");
    }

    function drawRealQrCodeOnline(container, text) {
      const image = document.createElement("img");
      image.alt = "QR-Code";
      image.width = 300;
      image.height = 300;
      image.style.background = "white";
      image.style.padding = "12px";
      image.style.boxShadow = "0 2px 8px rgba(0,0,0,0.16)";
      image.src = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&ecc=M&data=" + encodeURIComponent(String(text || ""));
      image.onerror = function () {
        container.innerHTML = "";
        const box = document.createElement("div");
        box.className = "errorBox";
        box.textContent = "Online-QR-Dienst konnte nicht geladen werden. Internetverbindung prüfen oder finale Offline-Version mit lokaler QR-Bibliothek verwenden.";
        container.appendChild(box);
      };
      container.appendChild(image);
    }

    function drawDemoMatrixCode(container, text) {
      // Stabiler Platzhalter ohne externe Ressource. Kein normgerechter QR-Code.
      const size = 33;
      const scale = 8;
      const quiet = 4;
      const canvas = document.createElement("canvas");
      const total = (size + quiet * 2) * scale;
      canvas.width = total;
      canvas.height = total;

      const ctx = canvas.getContext("2d");
      if (!ctx) throw new Error("Canvas wird nicht unterstützt.");

      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, total, total);
      ctx.fillStyle = "#000";

      const matrix = createDemoMatrix(size, text);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          if (matrix[y][x]) {
            ctx.fillRect((x + quiet) * scale, (y + quiet) * scale, scale, scale);
          }
        }
      }

      container.appendChild(canvas);
    }

    function createDemoMatrix(size, text) {
      const matrix = Array.from({ length: size }, () => Array(size).fill(false));
      addFinder(matrix, 0, 0);
      addFinder(matrix, size - 7, 0);
      addFinder(matrix, 0, size - 7);

      let hash = 2166136261;
      for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          if (isInFinderArea(size, x, y)) continue;
          hash ^= x * 374761393 + y * 668265263;
          hash = Math.imul(hash ^ (hash >>> 13), 1274126177);
          matrix[y][x] = ((hash >>> 24) & 1) === 1;
        }
      }
      return matrix;
    }

    function addFinder(matrix, x0, y0) {
      for (let y = 0; y < 7; y++) {
        for (let x = 0; x < 7; x++) {
          const outer = x === 0 || y === 0 || x === 6 || y === 6;
          const inner = x >= 2 && x <= 4 && y >= 2 && y <= 4;
          matrix[y0 + y][x0 + x] = outer || inner;
        }
      }
    }

    function isInFinderArea(size, x, y) {
      return (x < 9 && y < 9) || (x >= size - 9 && y < 9) || (x < 9 && y >= size - 9);
    }

    function closeQr() {
      byId("qrView").classList.remove("active");
    }

    async function copyPayload() {
      const text = String(currentPayload || "");
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          showMessage("Text kopiert.", "success");
        } else {
          window.prompt("Text kopieren:", text);
        }
      } catch (error) {
        window.prompt("Text kopieren:", text);
      }
    }

    async function refreshFromGoogleSheet() {
      if (!GOOGLE_SHEET_CSV_URL || GOOGLE_SHEET_CSV_URL.includes("PASTE_YOUR")) {
        showMessage("Bitte zuerst den Google-Sheet-CSV-Link im Code eintragen.", "warning");
        return;
      }

      try {
        const separator = GOOGLE_SHEET_CSV_URL.includes("?") ? "&" : "?";
        const response = await fetch(GOOGLE_SHEET_CSV_URL + separator + "t=" + Date.now(), { cache: "no-store" });

        if (!response.ok) {
          throw new Error("Google Sheet konnte nicht geladen werden. HTTP " + response.status);
        }

        const csv = await response.text();
        const parsed = parseCsv(csv);

        if (!parsed.length) {
          throw new Error("CSV enthält keine nutzbaren Daten.");
        }

        items = parsed;
        localStorage.setItem("sono_items", JSON.stringify(items));
        render();
        runTests();
        showMessage("Liste erfolgreich aktualisiert: " + items.length + " Einträge. Stand: " + new Date().toLocaleString("de-DE"), "success");
      } catch (error) {
        showMessage("Fehler beim Aktualisieren: " + (error && error.message ? error.message : String(error)), "error");
      }
    }

    function parseCsv(csv) {
      const text = String(csv || "").replace(/^\uFEFF/, "");
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === "," && !inQuotes) {
          row.push(field);
          field = "";
        } else if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && next === "\n") i++;
          row.push(field);
          if (row.some(cell => String(cell).trim() !== "")) rows.push(row);
          row = [];
          field = "";
        } else {
          field += char;
        }
      }

      row.push(field);
      if (row.some(cell => String(cell).trim() !== "")) rows.push(row);

      if (rows.length < 2) return [];

      const headers = rows[0].map(header => normalizeHeader(header));
      return rows.slice(1).map(cols => {
        return {
          region: getCsvValue(headers, cols, "region"),
          code: getCsvValue(headers, cols, "code"),
          en: getCsvValue(headers, cols, "en"),
          de: getCsvValue(headers, cols, "de"),
          beschreibung: getCsvValue(headers, cols, "beschreibung"),
          category: getCsvValue(headers, cols, "category"),
          indication: getCsvValue(headers, cols, "indication"),
          patient_position: getCsvValue(headers, cols, "patient_position"),
          sonde: getCsvValue(headers, cols, "sonde"),
          needle: getCsvValue(headers, cols, "needle"),
          medicament: getCsvValue(headers, cols, "medicament"),
          landmarks: getCsvValue(headers, cols, "landmarks"),
          needle_direction: getCsvValue(headers, cols, "needle_direction"),
          guidance: getCsvValue(headers, cols, "guidance"),
          tags: getCsvValue(headers, cols, "tags")
        };
      }).filter(item => item.region || item.code || item.en || item.de || item.beschreibung);
    }

    function normalizeHeader(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replaceAll(" ", "")
        .replaceAll("ä", "ae")
        .replaceAll("ö", "oe")
        .replaceAll("ü", "ue")
        .replaceAll("ß", "ss");
    }

    function getCsvValue(headers, cols, name) {
      const index = headers.indexOf(name);
      return index >= 0 ? String(cols[index] || "").trim() : "";
    }

    function loadLocalData() {
      try {
        const saved = localStorage.getItem("sono_items");
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length) items = parsed;
        }
      } catch (error) {
        console.error(error);
      }
    }

    function showMessage(text, type) {
      const element = byId("message");
      element.className = "small";
      if (type === "success") element.className += " success";
      if (type === "warning") element.className += " warning";
      if (type === "error") element.className += " errorBox";
      element.textContent = text;
    }

    function runTests() {
      const tests = [];
      function assert(name, condition) {
        tests.push({ name, ok: Boolean(condition) });
      }

      assert("Datenliste ist nicht leer", items.length > 0);
      assert("Suche 'pir' findet Piriformis", getFilteredItems("pir", "").some(x => x.code === "PIRI"));
      assert("Suche 'gon' findet GON", getFilteredItems("gon", "").some(x => x.code === "GON"));
      assert("Region HWS enthält PRNI-HWS", getFilteredItems("", "HWS").some(x => x.code === "PRNI-HWS"));
      assert("Untersucher steht im Payload", makePayload(items[0]).includes(untersucher));
      assert("Payload enthält Beschreibung", makePayload(items[0]).includes("Beschreibung:"));
      assert("Demo-Matrix hat 33 Zeilen", createDemoMatrix(33, "Test").length === 33);

      const csvSimple = "region,code,en,de,beschreibung\nHWS,GON,Greater occipital nerve block,Blockade N. occipitalis major,Text";
      assert("CSV: einfacher Import", parseCsv(csvSimple)[0].code === "GON");

      const csvWithComma = 'region,code,en,de,beschreibung\nLWS,ISG,"SI joint injection","ISG-Infiltration","Injektion am Iliosakralgelenk, ISG, SIG"';
      assert("CSV: Komma in Anführungszeichen", parseCsv(csvWithComma)[0].beschreibung.includes("ISG, SIG"));

      const csvWithCrLf = "region,code,en,de,beschreibung\r\nBecken,PIRI,Piriformis muscle injection,Injektion Piriformis,Text";
      assert("CSV: CRLF-Zeilenenden", parseCsv(csvWithCrLf)[0].code === "PIRI");

      const failed = tests.filter(t => !t.ok);
      const testResults = byId("testResults");
      if (failed.length) {
        testResults.textContent = "Tests fehlgeschlagen: " + failed.map(f => f.name).join(", ");
        testResults.style.color = "#900";
      } else {
        testResults.textContent = "Interne Tests bestanden: " + tests.length + "/" + tests.length;
        testResults.style.color = "#555";
      }
    }

    byId("search").addEventListener("input", render);
    byId("regionFilter").addEventListener("change", render);
    byId("refreshBtn").addEventListener("click", refreshFromGoogleSheet);
    byId("copyBtn").addEventListener("click", copyPayload);
    byId("closeBtn").addEventListener("click", closeQr);
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeQr();
    });

    loadLocalData();
    render();
    runTests();
  </script>
</body>
</html>
