<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>QR Code Dr. Radu-Lucian Jilavu</title>
  <style>
    :root {
      --bg: #f4f4f4;
      --fg: #111;
      --muted: #666;
      --card: #fff;
      --border: #d4d4d4;
      --dark: #111;
      --danger: #ffe8e8;
      --danger-border: #b00020;
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      overflow: hidden;
    }

    header {
      height: calc(52px + var(--safe-top));
      padding: calc(7px + var(--safe-top)) 10px 7px;
      background: var(--dark);
      color: white;
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .menuBtn, .homeLink {
      height: 36px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 9px;
      background: rgba(255,255,255,.08);
      color: white;
      font-size: 18px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
    }

    .homeLink { font-size: 13px; }

    .appTitle {
      min-width: 0;
      line-height: 1.08;
    }

    .appTitle strong {
      display: block;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .appTitle span {
      display: block;
      font-size: 11px;
      color: #cfcfcf;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    main {
      height: calc(100vh - 52px - var(--safe-top));
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      padding: 8px;
      gap: 6px;
      max-width: 760px;
      margin: 0 auto;
    }

    input, select, button {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
    }

    input, select {
      height: 40px;
      padding: 0 10px;
      background: white;
      font-size: 16px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 42px;
      gap: 6px;
    }

    .refreshBtn {
      height: 40px;
      padding: 0;
      background: #fff;
      color: #111;
      font-size: 19px;
    }

    .regionStrip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .regionStrip::-webkit-scrollbar { display: none; }

    .pill {
      flex: 0 0 auto;
      width: auto;
      height: 34px;
      padding: 0 10px;
      border-radius: 999px;
      background: white;
      color: #111;
      font-size: 13px;
    }

    .pill.active {
      background: #111;
      color: white;
      border-color: #111;
    }

    #results {
      overflow-y: auto;
      padding-bottom: 4px;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 9px 10px;
      margin-bottom: 6px;
      box-shadow: 0 1px 5px rgba(0,0,0,.07);
      text-align: left;
    }

    .region {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: .05em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      margin-top: 2px;
      line-height: 1.15;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .subtitle {
      font-size: 12px;
      color: #444;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .small {
      color: var(--muted);
      font-size: 11px;
      min-height: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .drawerBackdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      z-index: 20;
    }

    .drawerBackdrop.active { display: block; }

    .drawer {
      width: min(285px, 84vw);
      height: 100%;
      background: #fff;
      padding: calc(12px + var(--safe-top)) 10px 10px;
      box-shadow: 2px 0 18px rgba(0,0,0,.25);
      overflow-y: auto;
    }

    .drawer h2 {
      font-size: 16px;
      margin: 0 0 10px;
    }

    .drawer button {
      height: 38px;
      margin-bottom: 6px;
      text-align: left;
      padding: 0 10px;
      background: #f7f7f7;
    }

    .drawer button.active {
      background: #111;
      color: #fff;
    }

    .qrView {
      display: none;
      position: fixed;
      inset: 0;
      background: white;
      z-index: 30;
      padding: calc(8px + var(--safe-top)) 8px 8px;
      overflow: hidden;
    }

    .qrView.active {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 6px;
    }

    .qrHeader {
      display: grid;
      grid-template-columns: 1fr 42px;
      gap: 8px;
      align-items: center;
    }

    #qrTitle {
      margin: 0;
      font-size: 17px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 250px;
    }

    #qrcode img {
      width: min(76vw, 310px);
      height: min(76vw, 310px);
      background: white;
      padding: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.16);
    }

    .qrText {
      white-space: pre-wrap;
      text-align: left;
      background: #f2f2f2;
      padding: 8px;
      border-radius: 9px;
      font-size: 12px;
      line-height: 1.25;
      overflow-y: auto;
    }

    .qrActions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .secondaryBtn, .closeBtn {
      height: 40px;
      border: none;
    }

    .secondaryBtn { background: #eee; color: #111; }
    .closeBtn { background: #111; color: white; }

    .errorBox {
      background: var(--danger);
      border: 1px solid var(--danger-border);
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      text-align: left;
    }
  </style>
</head>
<body>
  <header>
    <button id="openDrawerBtn" class="menuBtn" type="button" aria-label="Regionen">☰</button>
    <div class="appTitle">
      <strong>QR Code Dr. Radu-Lucian Jilavu</strong>
      <span id="headerUrl">https://jbilus.github.io/sonoscape-qr/</span>
    </div>
    <a class="homeLink" href="./" aria-label="Home">Home</a>
  </header>

  <main>
    <div class="toolbar">
      <input id="search" placeholder="Suche: pir, gon, isg, knee ..." autofocus />
      <button id="refreshBtn" class="refreshBtn" type="button" title="Liste aktualisieren">↻</button>
    </div>

    <div id="regionStrip" class="regionStrip"></div>
    <div id="results"></div>
    <div id="message" class="small"></div>
  </main>

  <div id="drawerBackdrop" class="drawerBackdrop">
    <nav class="drawer" aria-label="Regionen">
      <h2>Regionen</h2>
      <div id="drawerRegions"></div>
    </nav>
  </div>

  <div id="qrView" class="qrView" aria-modal="true" role="dialog">
    <div class="qrHeader">
      <h2 id="qrTitle"></h2>
      <button id="closeTopBtn" class="closeBtn" type="button">×</button>
    </div>
    <div id="statusMessage"></div>
    <div id="qrcode"></div>
    <div id="qrPayload" class="qrText"></div>
    <div class="qrActions">
      <button id="copyBtn" class="secondaryBtn" type="button">Text kopieren</button>
      <button id="closeBtn" class="closeBtn" type="button">Schließen</button>
    </div>
  </div>

  <script>
    "use strict";

    const untersucher = "Dr. Radu-Lucian Jilavu";
    const HOME_URL = "https://jbilus.github.io/sonoscape-qr/";
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSmvm3tDY1IDmX_z6vre-vttTzzv_UpCrBpoRrOfx2FzgAi53n957cN_VP9OHO1uisRAAaSiYF3M2x3/pub?output=csv";

    const REGION_ORDER = [
      "Kopf", "Kopf/Hals", "HWS", "Schulter", "BWS", "Thorax", "Ellenbogen", "Handgelenk", "Hand", "Abdomen", "LWS", "Sakral", "Becken", "Hüftgelenk", "Kniegelenk", "Sprunggelenk", "Fuß", "Hydrodissection", "Infusion", "Implantate", "Sonstige"
    ];

    let currentPayload = "";
    let selectedRegion = "";
    let items = [
      { region: "HWS", code: "GON", en: "Greater occipital nerve block", de: "Blockade Nervus occipitalis major", beschreibung: "Ultraschallgeführte Blockade des großen Hinterhauptsnervs" },
      { region: "LWS", code: "ISG", en: "Sacroiliac joint injection", de: "ISG-Infiltration", beschreibung: "Injektion am Iliosakralgelenk" },
      { region: "Becken", code: "PIRI", en: "Piriformis muscle injection", de: "Piriformis-Injektion", beschreibung: "Injektion in den Piriformis-Muskel" }
    ];

    function byId(id) { return document.getElementById(id); }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalize(value) {
      return String(value || "").toLowerCase().trim();
    }

    function getRegionRank(region) {
      const index = REGION_ORDER.indexOf(String(region || ""));
      return index >= 0 ? index : 999;
    }

    function sortItemsAnatomically(list) {
      return list.slice().sort((a, b) => {
        const regionDiff = getRegionRank(a.region) - getRegionRank(b.region);
        if (regionDiff !== 0) return regionDiff;
        const codeA = String(a.code || a.de || a.en || "");
        const codeB = String(b.code || b.de || b.en || "");
        return codeA.localeCompare(codeB, "de");
      });
    }

    function makePayload(item) {
      const lines = [];
      lines.push("Beschreibung:");
      if (item.de) lines.push(String(item.de));
      if (item.beschreibung) lines.push(String(item.beschreibung));
      if (item.indication) lines.push("Indikation: " + String(item.indication));
      if (item.patient_position) lines.push("Lagerung: " + String(item.patient_position));
      if (item.sonde) lines.push("Sonde: " + String(item.sonde));
      if (item.guidance) lines.push("Guidance: " + String(item.guidance));
      lines.push("");
      lines.push("Untersucher:");
      lines.push(untersucher);
      return lines.join("\n");
    }

    function getRegions() {
      const set = new Set();
      items.forEach(item => { if (item.region) set.add(item.region); });
      return Array.from(set).sort((a, b) => {
        const diff = getRegionRank(a) - getRegionRank(b);
        return diff !== 0 ? diff : a.localeCompare(b, "de");
      });
    }

    function setRegion(region) {
      selectedRegion = region || "";
      closeDrawer();
      render();
    }

    function renderRegions() {
      const regions = ["", ...getRegions()];
      const strip = byId("regionStrip");
      const drawer = byId("drawerRegions");
      strip.innerHTML = "";
      drawer.innerHTML = "";

      regions.forEach(region => {
        const label = region || "Alle";
        const active = region === selectedRegion;

        const pill = document.createElement("button");
        pill.type = "button";
        pill.className = "pill" + (active ? " active" : "");
        pill.textContent = label;
        pill.addEventListener("click", () => setRegion(region));
        strip.appendChild(pill);

        const item = document.createElement("button");
        item.type = "button";
        item.className = active ? "active" : "";
        item.textContent = label;
        item.addEventListener("click", () => setRegion(region));
        drawer.appendChild(item);
      });
    }

    function getFilteredItems(query, region) {
      const q = normalize(query);
      return sortItemsAnatomically(items.filter(item => {
        const haystack = normalize(Object.values(item).join(" "));
        return (!region || item.region === region) && (!q || haystack.includes(q));
      }));
    }

    function render() {
      renderRegions();
      const filtered = getFilteredItems(byId("search").value, selectedRegion);
      const results = byId("results");
      results.innerHTML = "";

      if (filtered.length === 0) {
        results.innerHTML = '<div class="card">Keine Treffer.</div>';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "card";
        const meta = [item.region, item.code, item.category, item.guidance].filter(Boolean).join(" · ");
        const sub = [item.en, item.indication].filter(Boolean).join(" · ");
        card.innerHTML =
          '<div class="region">' + escapeHtml(meta) + '</div>' +
          '<div class="title">' + escapeHtml(item.de || item.en || item.code || "Ohne Titel") + '</div>' +
          '<div class="subtitle">' + escapeHtml(sub) + '</div>';
        card.addEventListener("click", () => showQr(item));
        results.appendChild(card);
      });
      byId("message").textContent = filtered.length + " / " + items.length + " Einträge";
    }

    function showQr(item) {
      currentPayload = makePayload(item);
      byId("qrTitle").textContent = String(item.code || item.de || item.en || "QR-Code");
      byId("qrPayload").textContent = currentPayload;
      byId("statusMessage").innerHTML = "";
      byId("qrcode").innerHTML = "";

      try {
        drawRealQrCodeOnline(byId("qrcode"), currentPayload);
      } catch (error) {
        byId("statusMessage").innerHTML = '<div class="errorBox">QR-Code konnte nicht erzeugt werden: ' + escapeHtml(error && error.message ? error.message : String(error)) + '</div>';
      }

      byId("qrView").classList.add("active");
    }

    function drawRealQrCodeOnline(container, text) {
      const image = document.createElement("img");
      image.alt = "QR-Code";
      image.src = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&ecc=M&data=" + encodeURIComponent(String(text || ""));
      image.onerror = function () {
        container.innerHTML = '<div class="errorBox">QR-Code konnte nicht geladen werden. Internetverbindung prüfen.</div>';
      };
      container.appendChild(image);
    }

    function closeQr() {
      byId("qrView").classList.remove("active");
    }

    function openDrawer() {
      byId("drawerBackdrop").classList.add("active");
    }

    function closeDrawer() {
      byId("drawerBackdrop").classList.remove("active");
    }

    async function copyPayload() {
      const text = String(currentPayload || "");
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          byId("message").textContent = "Text kopiert.";
        } else {
          window.prompt("Text kopieren:", text);
        }
      } catch (error) {
        window.prompt("Text kopieren:", text);
      }
    }

    async function refreshFromGoogleSheet() {
      try {
        byId("message").textContent = "Aktualisiere Liste ...";
        const separator = GOOGLE_SHEET_CSV_URL.includes("?") ? "&" : "?";
        const response = await fetch(GOOGLE_SHEET_CSV_URL + separator + "t=" + Date.now(), { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const csv = await response.text();
        const parsed = parseCsv(csv);
        if (!parsed.length) throw new Error("CSV enthält keine nutzbaren Daten.");
        items = sortItemsAnatomically(parsed);
        localStorage.setItem("sono_items", JSON.stringify(items));
        render();
        runTests();
        byId("message").textContent = "Aktualisiert: " + items.length + " Einträge · " + new Date().toLocaleString("de-DE");
      } catch (error) {
        byId("message").textContent = "Fehler beim Aktualisieren: " + (error && error.message ? error.message : String(error));
      }
    }

    function parseCsv(csv) {
      const text = String(csv || "").replace(/^\uFEFF/, "");
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];
        if (char === '"') {
          if (inQuotes && next === '"') { field += '"'; i++; }
          else { inQuotes = !inQuotes; }
        } else if (char === "," && !inQuotes) {
          row.push(field); field = "";
        } else if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && next === "\n") i++;
          row.push(field);
          if (row.some(cell => String(cell).trim() !== "")) rows.push(row);
          row = []; field = "";
        } else {
          field += char;
        }
      }
      row.push(field);
      if (row.some(cell => String(cell).trim() !== "")) rows.push(row);
      if (rows.length < 2) return [];

      const headers = rows[0].map(normalizeHeader);
      return rows.slice(1).map(cols => ({
        region: getCsvValue(headers, cols, ["region"]),
        code: getCsvValue(headers, cols, ["code", "id", "kurz", "kuerzel"]),
        en: getCsvValue(headers, cols, ["en", "english", "interventionen", "intervention"]),
        de: getCsvValue(headers, cols, ["de", "deutsch", "interventionde", "intervention1"]),
        beschreibung: getCsvValue(headers, cols, ["beschreibung", "description", "text", "starttext"]),
        category: getCsvValue(headers, cols, ["category", "kategorie", "type", "typ"]),
        indication: getCsvValue(headers, cols, ["indication", "indikation"]),
        patient_position: getCsvValue(headers, cols, ["patientposition", "lagerung"]),
        sonde: getCsvValue(headers, cols, ["sonde", "probe", "transducer"]),
        needle: getCsvValue(headers, cols, ["needle", "nadel"]),
        medicament: getCsvValue(headers, cols, ["medicament", "medikament", "injectate"]),
        landmarks: getCsvValue(headers, cols, ["landmarks", "anatomie"]),
        needle_direction: getCsvValue(headers, cols, ["needledirection", "needlepath", "nadelrichtung"]),
        guidance: getCsvValue(headers, cols, ["guidance", "bildgebung"]),
        tags: getCsvValue(headers, cols, ["tags", "keywords", "suchbegriffe"])
      })).filter(item => Object.values(item).some(value => String(value || "").trim() !== ""));
    }

    function normalizeHeader(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replaceAll(" ", "")
        .replaceAll("_", "")
        .replaceAll("-", "")
        .replaceAll("ä", "ae")
        .replaceAll("ö", "oe")
        .replaceAll("ü", "ue")
        .replaceAll("ß", "ss");
    }

    function getCsvValue(headers, cols, aliases) {
      for (const alias of aliases) {
        const index = headers.indexOf(normalizeHeader(alias));
        if (index >= 0) return String(cols[index] || "").trim();
      }
      return "";
    }

    function loadLocalData() {
      try {
        const saved = localStorage.getItem("sono_items");
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length) items = sortItemsAnatomically(parsed);
        }
      } catch (error) {
        console.error(error);
      }
    }

    function runTests() {
      const tests = [];
      function assert(name, condition) { tests.push({ name, ok: Boolean(condition) }); }
      assert("Datenliste ist nicht leer", items.length > 0);
      assert("Payload enthält Untersucher", makePayload(items[0]).includes(untersucher));
      assert("Suche findet Piriformis, falls vorhanden", getFilteredItems("pir", "").length >= 0);
      const csvWithComma = 'region,code,en,de,beschreibung\nLWS,ISG,"SI joint injection","ISG-Infiltration","Injektion am Iliosakralgelenk, ISG, SIG"';
      assert("CSV: Komma in Anführungszeichen", parseCsv(csvWithComma)[0].beschreibung.includes("ISG, SIG"));
      const csvWithSpaces = 'Region,Patient Position,Needle Direction\nHWS,Sitzend,in-plane';
      assert("CSV: Header mit Leerzeichen", parseCsv(csvWithSpaces)[0].patient_position === "Sitzend");
      const failed = tests.filter(t => !t.ok);
      if (failed.length) byId("message").textContent = "Tests fehlgeschlagen: " + failed.map(f => f.name).join(", ");
    }

    byId("headerUrl").textContent = HOME_URL;
    byId("search").addEventListener("input", render);
    byId("refreshBtn").addEventListener("click", refreshFromGoogleSheet);
    byId("copyBtn").addEventListener("click", copyPayload);
    byId("closeBtn").addEventListener("click", closeQr);
    byId("closeTopBtn").addEventListener("click", closeQr);
    byId("openDrawerBtn").addEventListener("click", openDrawer);
    byId("drawerBackdrop").addEventListener("click", event => { if (event.target === byId("drawerBackdrop")) closeDrawer(); });
    document.addEventListener("keydown", event => { if (event.key === "Escape") { closeQr(); closeDrawer(); } });

    loadLocalData();
    render();
    runTests();
  </script>
</body>
</html>
